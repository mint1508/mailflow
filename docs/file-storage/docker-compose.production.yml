name: ${COMPOSE_PROJECT_NAME:-file-pwa}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${FILE_DB_NAME:-file_storage}
      POSTGRES_USER: ${FILE_DB_USER:-file_storage}
      POSTGRES_PASSWORD: ${FILE_DB_PASSWORD:-}
    volumes:
      - file_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FILE_DB_USER:-file_storage} -d ${FILE_DB_NAME:-file_storage}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    restart: unless-stopped
    volumes:
      - file_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  file-service:
    image: ${FILE_SERVICE_IMAGE:-hippy-file-service:dev}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4310
      FILE_DATA_DIR: /data
      FILE_AUTH_MODE: oidc
      FILE_STORAGE_PROVIDER: google-drive
      FILE_WEB_REDIRECT_URL: https://files.hippy.vn/
      FILE_WEB_ORIGIN: https://files.hippy.vn
      FILE_OIDC_ISSUER: ${FILE_OIDC_ISSUER:-https://auth.hippy.vn/application/o/files/}
      FILE_OIDC_AUDIENCE: ${FILE_OIDC_AUDIENCE:-hippy-files}
      FILE_OIDC_USERINFO_URL: ${FILE_OIDC_USERINFO_URL:-https://auth.hippy.vn/application/o/userinfo/}
      FILE_OIDC_AUTHORIZATION_URL: ${FILE_OIDC_AUTHORIZATION_URL:-https://auth.hippy.vn/application/o/authorize/}
      FILE_OIDC_TOKEN_URL: ${FILE_OIDC_TOKEN_URL:-https://auth.hippy.vn/application/o/token/}
      FILE_OIDC_CLIENT_ID: ${FILE_OIDC_CLIENT_ID:-hippy-files}
      FILE_OIDC_CLIENT_SECRET: ${FILE_OIDC_CLIENT_SECRET:-}
      FILE_OIDC_REDIRECT_URI: ${FILE_OIDC_REDIRECT_URI:-https://files-api.hippy.vn/auth/oidc/callback}
      FILE_SESSION_SECRET: ${FILE_SESSION_SECRET:-}
      FILE_LIFECYCLE_SYNC_SECRET: ${FILE_LIFECYCLE_SYNC_SECRET:-}
      FILE_CURSOR_SECRET: ${FILE_CURSOR_SECRET:-}
      FILE_METADATA_WRITE_MODE: snapshot
      FILE_METADATA_READ_MODE: snapshot
      FILE_GOOGLE_CLIENT_ID: ${FILE_GOOGLE_CLIENT_ID:-}
      FILE_GOOGLE_CLIENT_SECRET: ${FILE_GOOGLE_CLIENT_SECRET:-}
      FILE_GOOGLE_REFRESH_TOKEN: ${FILE_GOOGLE_REFRESH_TOKEN:-}
      FILE_GOOGLE_ROOT_FOLDER_ID: ${FILE_GOOGLE_ROOT_FOLDER_ID:-}
      FILE_GOOGLE_ROOT_FOLDER_NAME: ${FILE_GOOGLE_ROOT_FOLDER_NAME:-Hippy Files}
      FILE_DB_URL: ${FILE_DB_URL:-postgres://${FILE_DB_USER:-file_storage}:${FILE_DB_PASSWORD:-}@postgres:5432/${FILE_DB_NAME:-file_storage}}
      FILE_REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:${FILE_SERVICE_PORT:-14310}:4310"
    volumes:
      - file_service_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4310/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  file-worker:
    image: ${FILE_SERVICE_IMAGE:-hippy-file-service:dev}
    command: ["node", "src/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FILE_DATA_DIR: /data
      FILE_AUTH_MODE: oidc
      FILE_STORAGE_PROVIDER: google-drive
      FILE_WEB_REDIRECT_URL: https://files.hippy.vn/
      FILE_WEB_ORIGIN: https://files.hippy.vn
      FILE_OIDC_ISSUER: ${FILE_OIDC_ISSUER:-https://auth.hippy.vn/application/o/files/}
      FILE_OIDC_AUDIENCE: ${FILE_OIDC_AUDIENCE:-hippy-files}
      FILE_OIDC_USERINFO_URL: ${FILE_OIDC_USERINFO_URL:-https://auth.hippy.vn/application/o/userinfo/}
      FILE_OIDC_AUTHORIZATION_URL: ${FILE_OIDC_AUTHORIZATION_URL:-https://auth.hippy.vn/application/o/authorize/}
      FILE_OIDC_TOKEN_URL: ${FILE_OIDC_TOKEN_URL:-https://auth.hippy.vn/application/o/token/}
      FILE_OIDC_CLIENT_ID: ${FILE_OIDC_CLIENT_ID:-hippy-files}
      FILE_OIDC_CLIENT_SECRET: ${FILE_OIDC_CLIENT_SECRET:-}
      FILE_OIDC_REDIRECT_URI: ${FILE_OIDC_REDIRECT_URI:-https://files-api.hippy.vn/auth/oidc/callback}
      FILE_SESSION_SECRET: ${FILE_SESSION_SECRET:-}
      FILE_LIFECYCLE_SYNC_SECRET: ${FILE_LIFECYCLE_SYNC_SECRET:-}
      FILE_CURSOR_SECRET: ${FILE_CURSOR_SECRET:-}
      FILE_METADATA_WRITE_MODE: snapshot
      FILE_METADATA_READ_MODE: snapshot
      FILE_GOOGLE_CLIENT_ID: ${FILE_GOOGLE_CLIENT_ID:-}
      FILE_GOOGLE_CLIENT_SECRET: ${FILE_GOOGLE_CLIENT_SECRET:-}
      FILE_GOOGLE_REFRESH_TOKEN: ${FILE_GOOGLE_REFRESH_TOKEN:-}
      FILE_GOOGLE_ROOT_FOLDER_ID: ${FILE_GOOGLE_ROOT_FOLDER_ID:-}
      FILE_GOOGLE_ROOT_FOLDER_NAME: ${FILE_GOOGLE_ROOT_FOLDER_NAME:-Hippy Files}
      FILE_DB_URL: ${FILE_DB_URL:-postgres://${FILE_DB_USER:-file_storage}:${FILE_DB_PASSWORD:-}@postgres:5432/${FILE_DB_NAME:-file_storage}}
      FILE_REDIS_URL: redis://redis:6379
    volumes:
      - file_service_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  file-web:
    image: ${FILE_WEB_IMAGE:-hippy-file-web:dev}
    restart: unless-stopped
    environment:
      FILE_IMAGE_DIGEST: ${FILE_IMAGE_DIGEST:-}
    ports:
      - "127.0.0.1:${FILE_WEB_PORT:-14300}:3000"
    depends_on:
      file-service:
        condition: service_healthy

volumes:
  file_service_data:
  file_postgres_data:
  file_redis_data:
