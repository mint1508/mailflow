# MailFlow — pre-built image install
#
# Quick start:
#   curl -o docker-compose.yml https://raw.githubusercontent.com/mint1508/mailflow/internal-main/docker-compose.ghcr.yml
#   curl -o .env               https://raw.githubusercontent.com/mint1508/mailflow/internal-main/.env.example
#   # edit .env, then:
#   docker compose up -d
#
# Set the reviewed tag and image digests in your .env. Never use latest:
#   MAILFLOW_VERSION=3.5.6-internal.1
#   FRONTEND_IMAGE_DIGEST=sha256:<digest-from-published-fork-image>
#   BACKEND_IMAGE_DIGEST=sha256:<digest-from-published-fork-image>

services:

  # ── Frontend (nginx — serves React SPA + proxies API) ───────────────────────
  # Exposes HTTPS on APP_PORT and HTTP on APP_HTTP_PORT.
  # HTTP is intended for use behind a reverse proxy that terminates TLS.
  frontend:
    image: ghcr.io/${IMAGE_NAMESPACE:-mint1508}/mailflow-frontend:${MAILFLOW_VERSION:?MAILFLOW_VERSION must be set}@${FRONTEND_IMAGE_DIGEST:?FRONTEND_IMAGE_DIGEST must be set}
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-443}:443"
      - "${APP_HTTP_PORT:-80}:80"
    volumes:
      - ./certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO/dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - mailflow

  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/${IMAGE_NAMESPACE:-mint1508}/mailflow-backend:${MAILFLOW_VERSION:?MAILFLOW_VERSION must be set}@${BACKEND_IMAGE_DIGEST:?BACKEND_IMAGE_DIGEST must be set}
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_VERSION: ${APP_VERSION:-}
      BUILD_SHA: ${GIT_SHA:-unknown}
      UPSTREAM_SHA: ${UPSTREAM_SHA:-unknown}
      SESSION_SECRET: ${SESSION_SECRET}
      APP_URL: ${APP_URL:-}
      FRONTEND_URL: ${APP_URL:-}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mailflow}
      DB_USER: ${DB_USER:-mailflow}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      IMAP_MAX_PERSISTENT_PER_HOST: ${IMAP_MAX_PERSISTENT_PER_HOST:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mailflow

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mailflow}
      POSTGRES_USER: ${DB_USER:-mailflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mailflow

  # ── Redis (sessions + caching) ───────────────────────────────────────────────
  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - mailflow

  # ── Caddy (automatic HTTPS via Let's Encrypt — optional) ────────────────────
  # Use docker-compose.https.yml to avoid the port conflict with the frontend:
  #   docker compose -f docker-compose.yml -f docker-compose.https.yml --profile https up -d
  # Requires DOMAIN, ACME_EMAIL, and APP_URL to be set in .env, and ports 80/443 open.
  caddy:
    profiles: ["https"]
    image: ${CADDY_IMAGE:-caddy:2-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b}
    container_name: ${COMPOSE_PROJECT_NAME:-mailflow}-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - frontend
    networks:
      - mailflow

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  mailflow:
    driver: bridge

configs:
  caddyfile:
    content: |
      {
          email ${ACME_EMAIL:-}
      }

      ${DOMAIN:-localhost} {
          reverse_proxy frontend:443 {
              transport http {
                  tls_insecure_skip_verify
              }
          }
      }
